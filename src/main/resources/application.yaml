server:
  port: 8085

spring:
  application:
    name: api-gateway

services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8092}
  book-url: ${BOOK_SERVICE_URL:http://localhost:8087}
  order-url: ${ORDER_SERVICE_URL:http://localhost:8090}
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8091}
  monolith-url: ${MONOLITH_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
